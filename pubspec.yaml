name: cryptominer
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.6.6
  dio: 5.7.0
  flutter_svg: ^2.0.9
  video_player: ^2.8.2
  shared_preferences: ^2.2.3
  google_sign_in: ^6.2.1
  socket_io_client: ^3.1.2
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.3
  firebase_messaging: ^16.4.1
  flutter_local_notifications: 18.0.0
  timezone: ^0.9.2
  cloud_firestore: ^6.6.0
  google_mobile_ads: ^9.0.0
  qr_flutter: ^4.1.0
  share_plus: ^13.2.0
  path_provider: ^2.1.6
  carousel_slider: ^5.1.2
  mobile_scanner: ^7.2.0
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/app_logo.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/logo/app_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logo/
    - assets/icons/
    - assets/videos/my_video3.mp4

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/font_family/Poppins/Poppins-Regular.ttf
        - asset: assets/font_family/Poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/font_family/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/font_family/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/font_family/Poppins/Poppins-Light.ttf
          weight: 300

flutter_native_splash:
  color: "#000000"
  image: "assets/logo/app_logo_splash.png"
  android_12:
    color: "#000000"
    image: "assets/logo/app_logo_splash.png"
